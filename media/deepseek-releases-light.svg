<title id="t">Generation speed, release by release</title>
<desc id="d">Line chart. Without a draft: 9.7 tokens per second before --numa-mirror, 18.4 with b5294, 22.2 with b5361. With the DSpark draft: 25.6 with b5294, 31.5 with b5345. The table under the chart has every figure.</desc>
